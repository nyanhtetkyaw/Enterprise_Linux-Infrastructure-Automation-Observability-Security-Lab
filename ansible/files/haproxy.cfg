global
    maxconn 4096

defaults
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:8080
    default_backend http_servers

backend http_servers
    balance roundrobin
    server httpd1 httpd-app-1:80 check
    server httpd2 httpd-app-2:80 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
