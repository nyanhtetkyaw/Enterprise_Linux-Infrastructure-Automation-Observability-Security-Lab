groups:

  - name: infrastructure

    rules:

      - alert: ServiceDown
        expr: up == 0
        for: 2m

        labels:
          severity: critical

        annotations:
          summary: "Monitoring target is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} is down."

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 85%."

      - alert: BlackboxHTTPFailure
        expr: probe_success == 0
        for: 2m

        labels:
          severity: critical

        annotations:
          summary: "HTTP endpoint unavailable"
          description: "{{ $labels.instance }} is failing HTTP health checks."
